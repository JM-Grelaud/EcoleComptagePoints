name: Pages (main + v5.0 beta)

on:
  push:
    branches: [main, v5.0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Site public : branche main, publiée à la racine
      - uses: actions/checkout@v4
        with:
          ref: main

      # Version beta : branche v5.0, publiée dans le sous-dossier v50/
      - uses: actions/checkout@v4
        with:
          ref: v5.0
          path: v50

      # Le .git ne doit pas se retrouver dans le site publié
      - run: rm -rf .git v50/.git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
